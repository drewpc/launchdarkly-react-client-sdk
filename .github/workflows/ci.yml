name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md' #Do not need to run CI for markdown changes.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-test:
    strategy:
      matrix:
        variations: [
          # {os: ubuntu-latest, node: latest},
          {os: ubuntu-latest, node: 'lts/*'},
        ]

    runs-on: ${{ matrix.variations.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.variations.node }}
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Install Codecov CLI as binary
        run: |
          # Replace 'linux' below with the appropriate OS (alpine, linux, macos, windows)
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov
      - name: Upload coverage files to Codecov
        run: ./codecov --enterprise-url https://codecov.pd-staging.com upload-process --slug "drewpc/launchdarkly-react-client-sdk" --fail-on-error -t "${{ secrets.CODECOV_TOKEN }}"
      - name: Upload test result files to Codecov
        run: ./codecov --enterprise-url https://codecov.pd-staging.com do-upload --slug "drewpc/launchdarkly-react-client-sdk" --fail-on-error -t "${{ secrets.CODECOV_TOKEN }}" --report-type test_results
